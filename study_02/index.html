<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="error-banner" class="error-banner" hidden></div>

  <header class="app-header">
    <h1>할 일 관리</h1>
    <span id="today-label" class="today-label"></span>
  </header>

  <section class="progress-section">
    <div id="progress" class="progress"></div>
  </section>

  <section class="add-form-section">
    <form id="add-form" class="add-form" novalidate>
      <input
        id="title-input"
        type="text"
        placeholder="할 일 입력..."
        maxlength="100"
        autocomplete="off"
      />
      <select id="category-input">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study" selected>공부</option>
      </select>
      <input id="due-date-input" type="date" />
      <button type="submit">추가</button>
    </form>
    <p id="title-error" class="field-error" hidden>할 일 제목을 입력해 주세요.</p>
  </section>

  <nav class="filter-tabs" id="filter-tabs">
    <button type="button" class="filter-tab" data-category="all">전체</button>
    <button type="button" class="filter-tab" data-category="work">업무</button>
    <button type="button" class="filter-tab" data-category="personal">개인</button>
    <button type="button" class="filter-tab" data-category="study">공부</button>
  </nav>

  <main id="todo-list" class="todo-list"></main>

  <script src="js/storage.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
